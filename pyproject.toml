[project]
name = "interface-ai-computer-use"
version = "0.1.0"
description = "Take-home: LLM discovery to deterministic computer-use capability replay"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "playwright>=1.59",
  "pydantic>=2.8",
  "openai>=1.60",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
computer-use = "interface_automation.cli:main"
legacy-demo = "demo_app.app:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
